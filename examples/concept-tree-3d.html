Customer-support and TAM prose craft for ticket replies, holding statements, status updates, escalation handoffs, and closing language. Covers first-response templates, de-escalation phrasing (HEARD, ASAP, LEAP), \"I hear you\" + concrete next step structure, apology calibration (acknowledge harm without admitting fault on undetermined causes), status-update cadence by severity (SEV1 every 15-30m, SEV2 every 1-4h, SEV3 daily), holding-statement patterns, warm vs cold handoff prose, phone-vs-ticket decision criteria,…", "sources": 8, "parent": "Writing and Documentation", "researchedAt": "2026-05-29T18:36:16.921Z", "refreshedAt": "2026-05-29T18:36:16.925Z", "conceptsCount": 9, "childAll": ["First-Response Templates", "HEARD De-escalation", "ASAP De-escalation", "Holding Statement Patterns", "Apology Calibration", "Status-Update Cadence by Severity", "Warm vs Cold Handoff", "Phone vs Ticket Decision", "CSAT and Closing Language"], "leaves": ["First-Response Templates", "HEARD De-escalation", "ASAP De-escalation", "Holding Statement Patterns", "Apology Calibration", "Status-Update Cadence by Severity", "Warm vs Cold Handoff", "Phone vs Ticket Decision", "CSAT and Closing Language"], "leafCount": 9, "val": 8.1}, {"id": "Microcopy and UI Writing", "name": "Microcopy and UI Writing", "isGroup": false, "color": "hsl(181, 62%, 60%)", "group": "Writing and Documentation", "skillId": "microcopy-and-ui-writing", "desc": "In-product UX writing for buttons, empty states, tooltips, form-field labels, validation messages, system messages, password-reset flows, onboarding tours, confirmation dialogs (destructive vs benign), modals, toasts, opt-in/opt-out copy, and 404/500 pages. Codifies the \"verb the noun\" button rule, the \"what you can do here\" empty-state rule, the \"be specific\" error rule, the \"match the destructive verb\" confirmation rule, sentence case vs title case decisions, NN/g's plain-language error guidelines, and…", "sources": 8, "parent": "Writing and Documentation", "researchedAt": "2026-05-29T18:36:19.633Z", "refreshedAt": "2026-05-29T18:36:19.636Z", "conceptsCount": 9, "childAll": ["Verb-the-Noun Button Rule", "Empty State Copy", "Error and Validation Messages", "Confirmation Dialogs", "Toast and Modal Patterns", "Sentence vs Title Case", "Onboarding and Password-Reset Flows", "Dark Pattern Avoidance", "Mailchimp/Polaris/HIG/Material/GOV.UK Conventions"], "leaves": ["Verb-the-Noun Button Rule", "Empty State Copy", "Error and Validation Messages", "Confirmation Dialogs", "Toast and Modal Patterns", "Sentence vs Title Case", "Onboarding and Password-Reset Flows", "Dark Pattern Avoidance", "Mailchimp/Polaris/HIG/Material/GOV.UK Conventions"], "leafCount": 9, "val": 8.1}, {"id": "Diátaxis Tutorial Quadrant", "name": "Diátaxis Tutorial Quadrant", "isGroup": false, "color": "hsl(181, 62%, 60%)", "group": "Writing and Documentation", "skillId": "tutorial-writing", "desc": "Learning-oriented documentation craft — the Diátaxis tutorial quadrant. Write scaffolded \"follow me\" lessons that guarantee success at every step, build a tiny working artifact, and leave the learner exit-with-a-completed-thing in hand. Covers narrator voice (\"we'll create…\"), no-detour discipline, Carpentries-style backward design, cognitive-load budgeting (7±2), confidence-by-layer construction, and the rule that learning is the goal, not the artifact.", "sources": 6, "parent": "Writing and Documentation", "researchedAt": "2026-05-29T19:02:08.626Z", "refreshedAt": "2026-05-29T19:02:08.630Z", "conceptsCount": 10, "childAll": ["Backward design", "Cognitive load 7±2", "Narrator voice", "Learner's promise", "Carpentries pedagogy"], "leaves": ["Backward design", "Cognitive load 7±2", "Narrator voice", "Learner's promise", "Carpentries pedagogy"], "leafCount": 5, "val": 4.5}, {"id": "Diátaxis How-To Quadrant", "name": "Diátaxis How-To Quadrant", "isGroup": false, "color": "hsl(181, 62%, 60%)", "group": "Writing and Documentation", "skillId": "howto-writing", "desc": "Problem-oriented step-by-step documentation craft — the Diátaxis how-to quadrant. Write goal-directed recipes for competent users who already know the product. Covers \"How to verb a noun\" titles, prerequisite blocks, single-goal-per-document discipline, numbered steps with imperative verbs, cookbook conventions, and the rule that how-tos assume competence (no teaching, no theory).", "sources": 5, "parent": "Writing and Documentation", "researchedAt": "2026-05-29T19:02:11.024Z", "refreshedAt": "2026-05-29T19:02:11.027Z", "conceptsCount": 10, "childAll": ["Prerequisite blocks", "Imperative steps", "Cookbook conventions", "Branching guides", "How-to vs tutorial"], "leaves": ["Prerequisite blocks", "Imperative steps", "Cookbook conventions", "Branching guides", "How-to vs tutorial"], "leafCount": 5, "val": 4.5}, {"id": "Diátaxis Reference Quadrant", "name": "Diátaxis Reference Quadrant", "isGroup": false, "color": "hsl(181, 62%, 60%)", "group": "Writing and Documentation", "skillId": "reference-doc-writing", "desc": "Information-oriented documentation craft — the Diátaxis reference quadrant. Write technical descriptions of an API, configuration, schema, CLI, or protocol where the reader's job is to look something up. Covers function signatures, parameter tables, return values, exhaustive coverage over narrative, strict consistency, alphabetical/logical ordering, search-discoverability, structure-mirrors-the-thing-described, and the no-surprises rule.", "sources": 5, "parent": "Writing and Documentation", "researchedAt": "2026-05-29T19:02:13.203Z", "refreshedAt": "2026-05-29T19:02:13.207Z", "conceptsCount": 10, "childAll": ["Parameter tables", "Exhaustive coverage", "No-surprises rule", "Structure-mirrors-product", "Search-discoverability"], "leaves": ["Parameter tables", "Exhaustive coverage", "No-surprises rule", "Structure-mirrors-product", "Search-discoverability"], "leafCount": 5, "val": 4.5}, {"id": "Diátaxis Explanation Quadrant", "name": "Diátaxis Explanation Quadrant", "isGroup": false, "color": "hsl(181, 62%, 60%)", "group": "Writing and Documentation", "skillId": "explanation-doc-writing", "desc": "Understanding-oriented documentation craft — the Diátaxis explanation quadrant. Write the \"discussion\" docs that build mental models, give background, explain why decisions were made, surface alternatives considered, and let the reader see the system in context. Covers the discussion-doc form, mental-model construction, history paragraphs, decisions-log patterns, \"Why we chose X\" pages, \"How X works under the hood\" pages, and the discipline that explanation is for understanding — not for proposing change (RFCs)…", "sources": 6, "parent": "Writing and Documentation", "researchedAt": "2026-05-29T19:02:15.397Z", "refreshedAt": "2026-05-29T19:02:15.401Z", "conceptsCount": 10, "childAll": ["Mental-model construction", "ADR pattern", "Decisions log", "Alternatives considered", "Discussion vs RFC vs runbook"], "leaves": ["Mental-model construction", "ADR pattern", "Decisions log", "Alternatives considered", "Discussion vs RFC vs runbook"], "leafCount": 5, "val": 4.5}, {"id": "Press Release Writing", "name": "Press Release Writing", "isGroup": false, "color": "hsl(181, 62%, 60%)", "group": "Writing and Documentation", "skillId": "press-release-writing", "desc": "Old-school press release craft for external/wire distribution — headline + subhead + dateline + lede + body + boilerplate + media-contact structure, \"FOR IMMEDIATE RELEASE\" vs embargo conventions, AP-style mechanics, the inverted pyramid, quote attribution rules, end-marker convention (\"###\" / \"-30-\"), photo captions, and wire-service (PR Newswire, BusinessWire, GlobeNewswire) submission hygiene.", "sources": 6, "parent": "Writing and Documentation", "researchedAt": "2026-05-29T19:03:08.443Z", "refreshedAt": "2026-05-29T19:03:08.447Z", "conceptsCount": 10, "childAll": [], "leaves": [], "leafCount": 0, "val": 2.5}, {"id": "Crisis PR Writing", "name": "Crisis PR Writing", "isGroup": false, "color": "hsl(181, 62%, 60%)", "group": "Writing and Documentation", "skillId": "crisis-pr-writing", "desc": "Crisis communications writing for non-operational PR crises — executive scandals, data-breach disclosures, recall notices, product-safety advisories, supplier exposure, social-media controversies, regulator-facing statements. Covers the acknowledge / explain / commit / follow-through pattern, the 60-minute holding statement, public-facing vs regulator-facing voice splits, the \"non-apology apology\" anti-pattern, Situational Crisis Communication Theory (SCCT) response posture selection, the Tylenol-standard…", "sources": 7, "parent": "Writing and Documentation", "researchedAt": "2026-05-29T19:03:10.970Z", "refreshedAt": "2026-05-29T19:03:10.973Z", "conceptsCount": 10, "childAll": [], "leaves": [], "leafCount": 0, "val": 2.5}, {"id": "Whitepaper Writing", "name": "Whitepaper Writing", "isGroup": false, "color": "hsl(181, 62%, 60%)", "group": "Writing and Documentation", "skillId": "whitepaper-writing", "desc": "Long-form B2B thought-leadership and lead-generation whitepaper craft — the problem → solution → proof → CTA arc, executive-summary discipline, Gordon Graham's three whitepaper types (backgrounder, numbered-list, problem/solution), sponsor-vs-vendor-neutral tone calibration, research-citation hygiene (lighter than academic, heavier than blog), 8–20 page conventions, design-driven layouts, gated-vs-ungated decisions, the \"case study within a whitepaper\" pattern, and references-appendix structure. TRIGGER when user…", "sources": 7, "parent": "Writing and Documentation", "researchedAt": "2026-05-29T19:03:13.363Z", "refreshedAt": "2026-05-29T19:03:13.372Z", "conceptsCount": 10, "childAll": [], "leaves": [], "leafCount": 0, "val": 2.5}, {"id": "Case Study Writing", "name": "Case Study Writing", "isGroup": false, "color": "hsl(181, 62%, 60%)", "group": "Writing and Documentation", "skillId": "case-study-writing", "desc": "Customer success story craft — the Challenge / Solution / Result template (BLUF for customer stories), customer-quote integration, anonymization decisions, \"X% improvement\" claim hygiene, before/after comparisons, multi-stakeholder voice (champion vs CFO vs end-user), the long-form / mid-form / one-pager derivative pipeline, written approval workflow, and the case-study-vs-testimonial-vs-reference-architecture distinction. TRIGGER when user asks to write/draft/review/critique a customer case study, customer…", "sources": 7, "parent": "Writing and Documentation", "researchedAt": "2026-05-29T19:03:16.030Z", "refreshedAt": "2026-05-29T19:03:16.033Z", "conceptsCount": 10, "childAll": [], "leaves": [], "leafCount": 0, "val": 2.5}, {"id": "Cover Letter Writing", "name": "Cover Letter Writing", "isGroup": false, "color": "hsl(181, 62%, 60%)", "group": "Writing and Documentation", "skillId": "cover-letter-writing", "desc": "Craft persuasive, customized cover letters that complement a resume — the three-part skeleton (why this company / why this role / why me), opener discipline, show-don't-list evidence rule, length conventions (one page, 250-350 words), customization-per-application requirement, and common cliché traps.", "sources": 6, "parent": "Writing and Documentation", "researchedAt": "2026-05-29T19:03:19.075Z", "refreshedAt": "2026-05-29T19:03:19.080Z", "conceptsCount": 8, "childAll": [], "leaves": [], "leafCount": 0, "val": 2.5}, {"id": "Job Description Writing", "name": "Job Description Writing", "isGroup": false, "color": "hsl(181, 62%, 60%)", "group": "Writing and Documentation", "skillId": "job-description-writing", "desc": "Recruiting-facing job description craft — write JDs that attract qualified, diverse candidates and comply with US pay-transparency law. Covers the responsibilities/requirements split, the \"what you'll do / what we look for / what we offer\" structure, day-in-the-life sections, must-haves vs nice-to-haves (with the gender-gap evidence), inclusive language and gender-coded word audit (Textio research), skills-based vs experience-based listings, salary range disclosure rules for US 2026 state laws, and the…", "sources": 8, "parent": "Writing and Documentation", "researchedAt": "2026-05-29T19:03:21.717Z", "refreshedAt": "2026-05-29T19:03:21.721Z", "conceptsCount": 10, "childAll": [], "leaves": [], "leafCount": 0, "val": 2.5}, {"id": "Performance Review Writing", "name": "Performance Review Writing", "isGroup": false, "color": "hsl(181, 62%, 60%)", "group": "Writing and Documentation", "skillId": "performance-review-writing", "desc": "Write performance reviews that are evidence-based, fair, and actionable — manager reviews, self-reviews, and peer/360 feedback. Covers the SBI (Situation-Behavior-Impact) feedback model from CCL, Kim Scott's Radical Candor quadrant, Camille Fournier's Manager's Path patterns, the \"no surprises\" rule, growth-area framing (not \"weakness\"), calibration language, the rating-vs-narrative split, self-review false-modesty traps, peer-review specificity, and the discipline of evidence-backed claims with concrete examples.", "sources": 7, "parent": "Writing and Documentation", "researchedAt": "2026-05-29T19:03:25.047Z", "refreshedAt": "2026-05-29T19:03:25.050Z", "conceptsCount": 12, "childAll": [], "leaves": [], "leafCount": 0, "val": 2.5}, {"id": "PRD Writing", "name": "PRD Writing", "isGroup": false, "color": "hsl(181, 62%, 60%)", "group": "Writing and Documentation", "skillId": "prd-writing", "desc": "Product Requirements Document (PRD) craft — the PM-owned genre that defines what to build and why, before engineering proposes how. Covers the \"problem / users / proposed solution / success metrics / open questions\" template, MVP-vs-v1-vs-roadmap scoping discipline, the Marty Cagan \"Inspired\" lean approach, Lenny Rachitsky's 1-pager pattern, Basecamp Shape Up \"pitch\" as a fixed-appetite alternative, wireframes-vs-prose tradeoffs, stakeholder sign-off cadence, and anti-patterns.", "sources": 6, "parent": "Writing and Documentation", "researchedAt": "2026-05-29T19:03:48.361Z", "refreshedAt": "2026-05-29T19:03:48.367Z", "conceptsCount": 10, "childAll": ["Problem-first structure (Lenny)", "Cagan four-section minimum", "MVP vs v1 vs roadmap scoping", "Shape Up pitch (Basecamp)", "Wireframes vs prose", "Leading vs lagging metrics", "Stakeholder sign-off pattern", "Non-goals as first-class section", "Designed-by-committee anti-pattern"], "leaves": ["Problem-first structure (Lenny)", "Cagan four-section minimum", "MVP vs v1 vs roadmap scoping", "Shape Up pitch (Basecamp)", "Wireframes vs prose", "Leading vs lagging metrics", "Stakeholder sign-off pattern", "Non-goals as first-class section", "Designed-by-committee anti-pattern"], "leafCount": 9, "val": 8.1}, {"id": "Spec Writing", "name": "Spec Writing", "isGroup": false, "color": "hsl(105, 62%, 60%)", "group": "Code Plan Writing", "skillId": "spec-writing", "desc": "Engineering implementation spec craft — the contract-shaped genre that says WHAT a system must do. Covers API specs (OpenAPI 3.1 for HTTP, AsyncAPI 3.0 for events), behavior specs (Gherkin / Given-When-Then), data specs (schema contracts), Joel Spolsky's \"Painless Functional Specifications\" tradition, the spec-as-contract mindset, versioning conventions (SemVer for APIs, deprecation windows), and the spec-file-vs-code-doc decision.", "sources": 7, "parent": "Code Plan Writing", "researchedAt": "2026-05-29T19:03:51.778Z", "refreshedAt": "2026-05-29T19:03:51.781Z", "conceptsCount": 10, "childAll": ["WHAT not HOW (Spolsky)", "Contract-first design", "OpenAPI 3.1", "AsyncAPI 3.0", "Gherkin / Given-When-Then", "Spec-as-contract mindset", "Versioning conventions", "Spec file vs code doc decision", "Examples as part of spec"], "leaves": ["WHAT not HOW (Spolsky)", "Contract-first design", "OpenAPI 3.1", "AsyncAPI 3.0", "Gherkin / Given-When-Then", "Spec-as-contract mindset", "Versioning conventions", "Spec file vs code doc decision", "Examples as part of spec"], "leafCount": 9, "val": 8.1}, {"id": "Pitch Deck Writing", "name": "Pitch Deck Writing", "isGroup": false, "color": "hsl(181, 62%, 60%)", "group": "Writing and Documentation", "skillId": "pitch-deck-writing", "desc": "Slide-by-slide narrative-arc craft for fundraising, sales, and partner pitch decks. Covers the Guy Kawasaki 10/20/30 rule, the Sequoia Capital / Reid Hoffman pitch deck structure (the canonical Series A template), the Y Combinator seed deck guide, the problem-solution-traction-team-ask arc, the Amazon six-page narrative memo as a deck alternative, \"deck vs narrative deck\" tradeoff, appendix slide convention, \"what I most want you to remember\" closer, and the \"designed by a designer, written by a writer\"…", "sources": 6, "parent": "Writing and Documentation", "researchedAt": "2026-05-29T19:03:54.390Z", "refreshedAt": "2026-05-29T19:03:54.393Z", "conceptsCount": 10, "childAll": ["10/20/30 rule (Kawasaki)", "Sequoia / Reid Hoffman structure", "Y Combinator seed deck", "Narrative arc (problem-solution-traction-team-ask)", "Appendix slide convention", "What I most want you to remember closer", "No-cliffhanger rule", "Narrative deck vs traditional deck", "Designer + writer collaboration", "Slide title as thesis"], "leaves": ["10/20/30 rule (Kawasaki)", "Sequoia / Reid Hoffman structure", "Y Combinator seed deck", "Narrative arc (problem-solution-traction-team-ask)", "Appendix slide convention", "What I most want you to remember closer", "No-cliffhanger rule", "Narrative deck vs traditional deck", "Designer + writer collaboration", "Slide title as thesis"], "leafCount": 10, "val": 9.0}, {"id": "Survey Question Writing", "name": "Survey Question Writing", "isGroup": false, "color": "hsl(181, 62%, 60%)", "group": "Writing and Documentation", "skillId": "survey-question-writing", "desc": "Bias-free survey question design — Likert scale construction (5-point vs 7-point, balanced/unbalanced anchors), NPS wording (Reichheld 200 const INIT_DAG = 'radialout';   // 'radialout' for trees, null (free layout) for generic graphs
const byId = new Map(DATA.nodes.map(n => [n.id, n]));
// live graph state starts as the backbone
let nodes = DATA.nodes.slice();
let links = DATA.links.slice();
const expanded = new Set();
let labelMode = 'all';   // 'all' | 'domains' | 'off'
const elem = document.getElementById('graph');

// always-on text label (three-spritetext, shared three instance via the bundle)
function makeLabel(n){
  if (labelMode === 'off') return null;
  if (labelMode === 'domains' && !n.isGroup) return null;
  const s = new SpriteText(n.name);
  s.color = n.isRoot ? '#ffffff' : (n.isGroup ? n.color : (n.isLeaf ? '#9fb0c4' : '#d4e2f4'));
  s.textHeight = n.isRoot ? 9 : n.isGroup ? 5 : (n.isLeaf ? 2 : 3);
  s.fontWeight = n.isGroup ? '600' : '400';
  s.backgroundColor = 'rgba(11,14,20,0.5)';
  s.padding = n.isGroup ? 1.5 : 0.8;
  s.borderRadius = 2;
  s.position.y = (n.val || 3) + 3;
  return s;
}

const Graph = ForceGraph3D()(elem)
  .backgroundColor('#0b0e14')
  .graphData({ nodes, links })
  .nodeId('id')
  .nodeVal('val')
  .nodeColor(n => n.color)
  .nodeOpacity(0.92)
  .nodeLabel(n => `<div style="padding:2px 4px"><b>${n.name}</b>${n.skillId?'<br><span style=\"color:#9fb3c8\">'+n.skillId+'</span>':''}${n.leafCount?'<br>'+n.leafCount+' sub-concepts'+(n.sources?' · '+n.sources+' sources':''):(n.sources?'<br>'+n.sources+' sources':'')}</div>`)
  .linkColor(l => {
    const s = (l.source && typeof l.source === 'object') ? l.source : byId.get(l.source);
    return (s && s.color) ? s.color : '#9fb0c4';      // branch inherits its parent's domain color
  })
  .linkWidth(0.9)
  .linkOpacity(0.55)
  .linkCurvature(0.06)
  .linkDirectionalArrowLength(2.2)
  .linkDirectionalArrowRelPos(0.92)
  .linkDirectionalArrowColor(l => {
    const s = (l.source && typeof l.source === 'object') ? l.source : byId.get(l.source);
    return (s && s.color) ? s.color : '#9fb0c4';
  })
  .dagMode(INIT_DAG)
  .dagLevelDistance(60)
  .nodeThreeObjectExtend(true)
  .nodeThreeObject(makeLabel)
  .onNodeClick(node => focusNode(node))
  .onBackgroundClick(() => showAll());

// expand / collapse a node's leaf sub-concepts (driven from the details panel button)
function toggleExpand(node){
  if (!node.leaves || !node.leaves.length) return;
  if (!expanded.has(node.id)){
    expanded.add(node.id);
    node.leaves.forEach(leaf => {
      const id = node.id + ' ▸ ' + leaf;
      if (!byId.has(id)){
        const ln = { id, name: leaf, isLeaf: true, color: node.color, group: node.group,
                     parentName: node.name, val: 1.6, leafCount: 0, childAll: [] };
        byId.set(id, ln); nodes.push(ln);
      }
      links.push({ source: node.id, target: node.id + ' ▸ ' + leaf });
    });
  } else {
    expanded.delete(node.id);
    const dead = new Set(node.leaves.map(l => node.id + ' ▸ ' + l));
    nodes = nodes.filter(n => !dead.has(n.id));
    links = links.filter(l => !dead.has(l.target.id ?? l.target));
    dead.forEach(d => byId.delete(d));
  }
  render();
}

Graph.d3Force('charge').strength(-130);
Graph.d3Force('link').distance(34);

// fly the camera to a node
function flyTo(n){
  if (!n || n.x == null) return;
  const dist = 90, r = Math.hypot(n.x, n.y, n.z) || 1;
  Graph.cameraPosition({ x:n.x*(1+dist/r), y:n.y*(1+dist/r), z:n.z*(1+dist/r) }, n, 900);
}

// ---- details panel: show everything we know about a clicked concept ----
const details = document.getElementById('details');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const row = (k, v) => (v == null || v === '') ? '' : '<dt>' + esc(k) + '</dt><dd>' + v + '</dd>';

function showDetails(node){
  const type = node.isRoot ? 'Root' : node.isGroup ? 'Domain'
             : node.isLeaf ? 'Leaf sub-concept' : 'Concept';
  const kids = node.childAll || [];
  let kidsHtml = '';
  if (kids.length){
    kidsHtml = '<h3>' + kids.length + ' sub-concepts</h3><ul>' + kids.map(c =>
      byId.has(c) ? '<li><a data-go="' + esc(c) + '">' + esc(c) + '</a></li>'
                  : '<li>' + esc(c) + '</li>').join('') + '</ul>';
  }
  let expandBtn = '';
  if (node.leaves && node.leaves.length){
    expandBtn = '<button class="expand">' +
      (expanded.has(node.id) ? '▾ Collapse sub-concepts'
                             : '▸ Expand ' + node.leaves.length + ' sub-concepts in 3D') + '</button>';
  }
  const fmt = d => d ? esc(String(d).slice(0,10)) : '';
  details.innerHTML =
    '<button class="close" title="close">×</button>' +
    (focusId ? '<button class="showall">⟲ Show all nodes</button>' : '') +
    '<span class="badge" style="background:' + (node.color || '#888') + '">' + type + '</span>' +
    '<h2>' + esc(node.name) + '</h2>' +
    (node.desc ? '<p class="desc" style="border-color:' + (node.color || '#2a3344') + '">'
                 + esc(node.desc) + '</p>' : '') +
    '<dl>' +
      row('Domain', (node.group && node.group !== node.name) ? esc(node.group) : '') +
      row('Parent', esc(node.parent || node.parentName || '—')) +
      row('Skill', node.skillId ? '<code>' + esc(node.skillId) + '</code>' : '') +
      row('Sources', node.sources != null ? node.sources : '') +
      row('Sub-concepts', node.conceptsCount != null ? node.conceptsCount : (kids.length || '')) +
      row('Researched', fmt(node.researchedAt)) +
      row('Refreshed', fmt(node.refreshedAt)) +
    '</dl>' + expandBtn + kidsHtml;
  details.style.display = 'block';
  details.querySelector('.close').onclick = () => { details.style.display = 'none'; };
  const sa = details.querySelector('.showall');
  if (sa) sa.onclick = showAll;
  const eb = details.querySelector('button.expand');
  if (eb) eb.onclick = () => { toggleExpand(node); showDetails(node); };
  details.querySelectorAll('[data-go]').forEach(a => a.onclick = () => {
    const t = byId.get(a.dataset.go);
    if (t) focusNode(t);
  });
}

// domain navigator: clickable chip per top-level group (always-visible wayfinding)
const dom = document.getElementById('domains');
DATA.nodes.filter(n => n.isGroup && !n.isRoot)
  .sort((a,b) => a.name.localeCompare(b.name))
  .forEach(g => {
    const c = document.createElement('span');
    c.className = 'chip'; c.textContent = g.name; c.style.background = g.color;
    c.title = g.name;
    c.onclick = () => focusNode(byId.get(g.id));
    dom.appendChild(c);
  });

// layout-mode buttons (scoped to data-mode so they don't catch the label buttons)
document.querySelectorAll('#panel [data-mode]').forEach(b => b.onclick = () => {
  document.querySelectorAll('#panel [data-mode]').forEach(x => x.classList.remove('active'));
  b.classList.add('active');
  const m = b.dataset.mode === 'null' ? null : b.dataset.mode;
  Graph.dagMode(m); Graph.numDimensions(3); Graph.d3ReheatSimulation();
});

// label-mode buttons (all / domains-only / off) — re-applies the nodeThreeObject accessor
document.querySelectorAll('#panel [data-label]').forEach(b => b.onclick = () => {
  document.querySelectorAll('#panel [data-label]').forEach(x => x.classList.remove('active'));
  b.classList.add('active');
  labelMode = b.dataset.label;
  Graph.nodeThreeObject(makeLabel);   // force re-evaluation of all node objects
});

// sync the layout buttons to the initial dag mode (Free is active for generic graphs)
(function(){
  const v = (INIT_DAG === null) ? 'null' : INIT_DAG;
  document.querySelectorAll('#panel [data-mode]').forEach(x =>
    x.classList.toggle('active', x.dataset.mode === v));
})();

// search → focus matching node
document.getElementById('search').addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  const q = e.target.value.trim().toLowerCase();
  if (!q) return;
  const hit = nodes.find(n => n.name.toLowerCase().includes(q));
  if (hit) focusNode(hit);
});

// ---- focus mode: clicking a node shows only it + its directly-linked neighbors ----
let focusId = null;
const lid = e => (e && e.id != null) ? e.id : e;   // link endpoint -> id (object or string)

function setCount(nc, lc){
  document.getElementById('count').textContent = focusId == null
    ? nc + ' nodes · ' + lc + ' links'
    : 'Focused on “' + (byId.get(focusId)?.name || focusId) + '” — ' + nc + ' nodes · ' + lc +
      ' links · click empty space or Show all to reset';
}

function render(){
  let fn, fl;
  if (focusId == null){ fn = nodes; fl = links; }
  else {
    const keep = new Set([focusId]); fl = [];
    links.forEach(l => {
      const s = lid(l.source), t = lid(l.target);
      if (s === focusId){ keep.add(t); fl.push(l); }
      else if (t === focusId){ keep.add(s); fl.push(l); }
    });
    fn = nodes.filter(n => keep.has(n.id));
  }
  Graph.graphData({ nodes: fn, links: fl });
  setCount(fn.length, fl.length);
}

function focusNode(node){
  if (!node) return;
  focusId = node.id;
  render();
  showDetails(node);
  setTimeout(() => Graph.zoomToFit(600, 50), 300);   // frame the isolated neighborhood
}

function showAll(){
  focusId = null;
  details.style.display = 'none';   // reset gesture clears the (now-stale) panel too
  render();
  setTimeout(() => Graph.zoomToFit(700, 60), 200);
}

render();   // initial full render + count
</script>
</body>
</html>
