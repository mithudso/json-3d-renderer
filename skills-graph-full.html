  s.padding = n.isGroup ? 1.5 : 0.8;
  s.borderRadius = 2;
  s.position.y = (n.val || 3) + 3;
  return s;
}

const Graph = ForceGraph3D()(elem)
  .backgroundColor('#0b0e14')
  .graphData({ nodes, links })
  .nodeId('id')
  .nodeVal('val')
  .nodeColor(n => n.color)
  .nodeOpacity(0.92)
  .nodeLabel(n => `<div style="padding:2px 4px"><b>${n.name}</b>${n.skillId?'<br><span style=\"color:#9fb3c8\">'+n.skillId+'</span>':''}${n.leafCount?'<br>'+n.leafCount+' sub-concepts'+(n.sources?' · '+n.sources+' sources':''):(n.sources?'<br>'+n.sources+' sources':'')}</div>`)
  .linkColor(l => {
    const s = (l.source && typeof l.source === 'object') ? l.source : byId.get(l.source);
    return (s && s.color) ? s.color : '#9fb0c4';      // branch inherits its parent's domain color
  })
  .linkWidth(0.9)
  .linkOpacity(0.55)
  .linkCurvature(0.06)
  .linkDirectionalArrowLength(2.2)
  .linkDirectionalArrowRelPos(0.92)
  .linkDirectionalArrowColor(l => {
    const s = (l.source && typeof l.source === 'object') ? l.source : byId.get(l.source);
    return (s && s.color) ? s.color : '#9fb0c4';
  })
  .dagMode(INIT_DAG)
  .dagLevelDistance(60)
  .nodeThreeObjectExtend(true)
  .nodeThreeObject(makeLabel)
  .onNodeClick(node => focusNode(node))
  .onBackgroundClick(() => showAll());

// expand / collapse a node's leaf sub-concepts (driven from the details panel button)
function toggleExpand(node){
  if (!node.leaves || !node.leaves.length) return;
  if (!expanded.has(node.id)){
    expanded.add(node.id);
    node.leaves.forEach(leaf => {
      const id = node.id + ' ▸ ' + leaf;
      if (!byId.has(id)){
        const ln = { id, name: leaf, isLeaf: true, color: node.color, group: node.group,
                     parentName: node.name, val: 1.6, leafCount: 0, childAll: [] };
        byId.set(id, ln); nodes.push(ln);
      }
      links.push({ source: node.id, target: node.id + ' ▸ ' + leaf });
    });
  } else {
    expanded.delete(node.id);
    const dead = new Set(node.leaves.map(l => node.id + ' ▸ ' + l));
    nodes = nodes.filter(n => !dead.has(n.id));
    links = links.filter(l => !dead.has(l.target.id ?? l.target));
    dead.forEach(d => byId.delete(d));
  }
  render();
}

Graph.d3Force('charge').strength(-130);
Graph.d3Force('link').distance(34);

// fly the camera to a node
function flyTo(n){
  if (!n || n.x == null) return;
  const dist = 90, r = Math.hypot(n.x, n.y, n.z) || 1;
  Graph.cameraPosition({ x:n.x*(1+dist/r), y:n.y*(1+dist/r), z:n.z*(1+dist/r) }, n, 900);
}

// ---- details panel: show everything we know about a clicked concept ----
const details = document.getElementById('details');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const row = (k, v) => (v == null || v === '') ? '' : '<dt>' + esc(k) + '</dt><dd>' + v + '</dd>';

function showDetails(node){
  const type = node.isRoot ? 'Root' : node.isGroup ? 'Domain'
             : node.isLeaf ? 'Leaf sub-concept' : 'Concept';
  const kids = node.childAll || [];
  let kidsHtml = '';
  if (kids.length){
    kidsHtml = '<h3>' + kids.length + ' sub-concepts</h3><ul>' + kids.map(c =>
      byId.has(c) ? '<li><a data-go="' + esc(c) + '">' + esc(c) + '</a></li>'
                  : '<li>' + esc(c) + '</li>').join('') + '</ul>';
  }
  let expandBtn = '';
  if (node.leaves && node.leaves.length){
    expandBtn = '<button class="expand">' +
      (expanded.has(node.id) ? '▾ Collapse sub-concepts'
                             : '▸ Expand ' + node.leaves.length + ' sub-concepts in 3D') + '</button>';
  }
  const fmt = d => d ? esc(String(d).slice(0,10)) : '';
  details.innerHTML =
    '<button class="close" title="close">×</button>' +
    (focusId ? '<button class="showall">⟲ Show all nodes</button>' : '') +
    '<span class="badge" style="background:' + (node.color || '#888') + '">' + type + '</span>' +
    '<h2>' + esc(node.name) + '</h2>' +
    (node.desc ? '<p class="desc" style="border-color:' + (node.color || '#2a3344') + '">'
                 + esc(node.desc) + '</p>' : '') +
    '<dl>' +
      row('Domain', (node.group && node.group !== node.name) ? esc(node.group) : '') +
      row('Parent', esc(node.parent || node.parentName || '—')) +
      row('Skill', node.skillId ? '<code>' + esc(node.skillId) + '</code>' : '') +
      row('Sources', node.sources != null ? node.sources : '') +
      row('Sub-concepts', node.conceptsCount != null ? node.conceptsCount : (kids.length || '')) +
      row('Researched', fmt(node.researchedAt)) +
      row('Refreshed', fmt(node.refreshedAt)) +
    '</dl>' + expandBtn + kidsHtml;
  details.style.display = 'block';
  details.querySelector('.close').onclick = () => { details.style.display = 'none'; };
  const sa = details.querySelector('.showall');
  if (sa) sa.onclick = showAll;
  const eb = details.querySelector('button.expand');
  if (eb) eb.onclick = () => { toggleExpand(node); showDetails(node); };
  details.querySelectorAll('[data-go]').forEach(a => a.onclick = () => {
    const t = byId.get(a.dataset.go);
    if (t) focusNode(t);
  });
}

// domain navigator: clickable chip per top-level group (always-visible wayfinding)
const dom = document.getElementById('domains');
DATA.nodes.filter(n => n.isGroup && !n.isRoot)
  .sort((a,b) => a.name.localeCompare(b.name))
  .forEach(g => {
    const c = document.createElement('span');
    c.className = 'chip'; c.textContent = g.name; c.style.background = g.color;
    c.title = g.name;
    c.onclick = () => focusNode(byId.get(g.id));
    dom.appendChild(c);
  });

// layout-mode buttons (scoped to data-mode so they don't catch the label buttons)
document.querySelectorAll('#panel [data-mode]').forEach(b => b.onclick = () => {
  document.querySelectorAll('#panel [data-mode]').forEach(x => x.classList.remove('active'));
  b.classList.add('active');
  const m = b.dataset.mode === 'null' ? null : b.dataset.mode;
  Graph.dagMode(m); Graph.numDimensions(3); Graph.d3ReheatSimulation();
});

// label-mode buttons (all / domains-only / off) — re-applies the nodeThreeObject accessor
document.querySelectorAll('#panel [data-label]').forEach(b => b.onclick = () => {
  document.querySelectorAll('#panel [data-label]').forEach(x => x.classList.remove('active'));
  b.classList.add('active');
  labelMode = b.dataset.label;
  Graph.nodeThreeObject(makeLabel);   // force re-evaluation of all node objects
});

// sync the layout buttons to the initial dag mode (Free is active for generic graphs)
(function(){
  const v = (INIT_DAG === null) ? 'null' : INIT_DAG;
  document.querySelectorAll('#panel [data-mode]').forEach(x =>
    x.classList.toggle('active', x.dataset.mode === v));
})();

// search → focus matching node
document.getElementById('search').addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  const q = e.target.value.trim().toLowerCase();
  if (!q) return;
  const hit = nodes.find(n => n.name.toLowerCase().includes(q));
  if (hit) focusNode(hit);
});

// ---- focus mode: clicking a node shows only it + its directly-linked neighbors ----
let focusId = null;
const lid = e => (e && e.id != null) ? e.id : e;   // link endpoint -> id (object or string)

function setCount(nc, lc){
  document.getElementById('count').textContent = focusId == null
    ? nc + ' nodes · ' + lc + ' links'
    : 'Focused on “' + (byId.get(focusId)?.name || focusId) + '” — ' + nc + ' nodes · ' + lc +
      ' links · click empty space or Show all to reset';
}

function render(){
  let fn, fl;
  if (focusId == null){ fn = nodes; fl = links; }
  else {
    const keep = new Set([focusId]); fl = [];
    links.forEach(l => {
      const s = lid(l.source), t = lid(l.target);
      if (s === focusId){ keep.add(t); fl.push(l); }
      else if (t === focusId){ keep.add(s); fl.push(l); }
    });
    fn = nodes.filter(n => keep.has(n.id));
  }
  Graph.graphData({ nodes: fn, links: fl });
  setCount(fn.length, fl.length);
}

function focusNode(node){
  if (!node) return;
  focusId = node.id;
  render();
  showDetails(node);
  setTimeout(() => Graph.zoomToFit(600, 50), 300);   // frame the isolated neighborhood
}

function showAll(){
  focusId = null;
  details.style.display = 'none';   // reset gesture clears the (now-stale) panel too
  render();
  setTimeout(() => Graph.zoomToFit(700, 60), 200);
}

render();   // initial full render + count
</script>
</body>
</html>
