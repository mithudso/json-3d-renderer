<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8">
<title>Concept Tree — 3D Mind Map</title>
<style>
  html,body{margin:0;height:100%;background:#0b0e14;color:#e6e6e6;font:13px/1.45 -apple-system,system-ui,sans-serif;overflow:hidden}
  #graph{position:fixed;inset:0}
  #panel{position:fixed;top:12px;left:12px;z-index:10;background:rgba(16,20,28,.86);
    border:1px solid #2a3344;border-radius:10px;padding:12px 14px;max-width:300px;backdrop-filter:blur(6px)}
  #panel h1{font-size:14px;margin:0 0 6px}
  #panel .muted{color:#8b97a8;font-size:11px}
  #search{width:100%;box-sizing:border-box;margin:8px 0 6px;padding:6px 8px;border-radius:6px;
    border:1px solid #2a3344;background:#0e131c;color:#e6e6e6}
  .row{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
  .row button{flex:1;cursor:pointer;background:#1b2533;color:#cdd6e3;border:1px solid #2a3344;
    border-radius:6px;padding:5px 6px;font-size:11px}
  .row button.active{background:#2d6cdf;border-color:#2d6cdf;color:#fff}
  #hint{margin-top:8px;color:#8b97a8;font-size:11px}
  #domains{margin-top:10px;max-height:42vh;overflow:auto;display:flex;flex-wrap:wrap;gap:4px}
  #domains .chip{cursor:pointer;font-size:10.5px;padding:2px 7px;border-radius:10px;
    border:1px solid #2a3344;color:#0b0e14;white-space:nowrap;line-height:1.5}
  #domains .chip:hover{outline:1px solid #fff}
  #count{position:fixed;bottom:10px;left:12px;z-index:10;color:#8b97a8;font-size:11px;
    background:rgba(16,20,28,.7);padding:4px 8px;border-radius:6px}
  #details{position:fixed;top:12px;right:12px;z-index:11;width:330px;max-height:90vh;overflow:auto;
    background:rgba(16,20,28,.94);border:1px solid #2a3344;border-radius:10px;padding:14px 16px;
    backdrop-filter:blur(6px);display:none}
  #details h2{font-size:15px;margin:6px 18px 2px 0;word-break:break-word}
  #details .badge{display:inline-block;font-size:10px;padding:1px 9px;border-radius:9px;
    color:#0b0e14;font-weight:700}
  #details .close{position:absolute;top:8px;right:11px;cursor:pointer;color:#8b97a8;
    font-size:18px;border:none;background:none;line-height:1}
  #details .desc{font-size:12px;line-height:1.5;color:#c2cfde;margin:10px 0 2px;
    padding:6px 0 6px 9px;border-left:3px solid #2a3344}
  #details dl{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;margin:11px 0;font-size:12px}
  #details dt{color:#8b97a8}
  #details dd{margin:0;color:#dfe7f2;word-break:break-word}
  #details code{background:#0e131c;border:1px solid #2a3344;border-radius:4px;padding:0 4px;font-size:11px}
  #details h3{font-size:11px;color:#8b97a8;margin:10px 0 5px;text-transform:uppercase;letter-spacing:.04em}
  #details ul{margin:0;padding:0}
  #details li{font-size:12px;margin:2px 0;list-style:none;color:#c7d2e0}
  #details a{color:#7fb0ff;cursor:pointer;text-decoration:none}
  #details a:hover{text-decoration:underline}
  #details button.expand{margin-top:11px;width:100%;cursor:pointer;background:#2d6cdf;border:none;
    color:#fff;padding:7px;border-radius:6px;font-size:12px}
  #details button.showall{display:block;margin:2px 0 8px;cursor:pointer;background:#1b2533;
    border:1px solid #2a3344;color:#cdd6e3;padding:5px 10px;border-radius:6px;font-size:11px}
  #details button.showall:hover{background:#243043}
</style>
</head>
<body>
<div id="graph"></div>
<div id="panel">
  <h1>Concept Tree — 3D Mind Map</h1>
  <div class="muted">465 backbone nodes · 86 domains · 454 concepts · 3404 expandable leaves</div>
  <input id="search" placeholder="Search a concept…" autocomplete="off">
  <div class="row">
    <button data-mode="radialout" class="active">Radial</button>
    <button data-mode="td">Top-down</button>
    <button data-mode="null">Free</button>
  </div>
  <div class="row" id="labelmodes">
    <button data-label="all" class="active">Labels: all</button>
    <button data-label="domains">domains</button>
    <button data-label="off">off</button>
  </div>
  <div id="hint">Click a node → isolates it + its linked neighbors and shows details · click empty space or “Show all” to reset · drag to rotate · scroll to zoom</div>
  <div id="domains"></div>
</div>
<div id="details"></div>
<div id="count"></div>
<!-- library bundle vendored locally (three + three-spritetext + 3d-force-graph, one shared three instance; no external CDN load) — see scripts/build-concept-tree-3d.py -->
<script src="concept-tree-3d.bundle.js"></script>
<script>
const DATA = {"nodes":[{"id":"Global Context Hub Architecture","name":"Global Context Hub Architecture","isRoot":true,"isGroup":true,"group":"Global Context Hub Architecture","color":"#ffffff","val":40,"desc":"Researched on 2026-08-18","leafCount":4},{"id":"Concept Tree Tracking","name":"Concept Tree Tracking","isRoot":false,"isGroup":true,"group":"Concept Tree Tracking","color":"hsl(0, 62%, 60%)","val":16,"desc":"Researched on 2026-08-18","leafCount":1},{"id":"3D Force-Directed Graphs","name":"3D Force-Directed Graphs","isRoot":false,"isGroup":false,"group":"Global Context Hub Architecture","color":"#ffffff","val":8,"desc":"Researched on 2026-08-18","leafCount":0},{"id":"Library Registries","name":"Library Registries","isRoot":false,"isGroup":true,"group":"Library Registries","color":"hsl(138, 62%, 60%)","val":16,"desc":"Researched on 2026-08-18","leafCount":4},{"id":"MCP Server Library","name":"MCP Server Library","isRoot":false,"isGroup":false,"group":"Global Context Hub Architecture","color":"#ffffff","val":8,"desc":"Researched on 2026-08-18","leafCount":0},{"id":"Repo Scenarios Library","name":"Repo Scenarios Library","isRoot":false,"isGroup":false,"group":"Global Context Hub Architecture","color":"#ffffff","val":8,"desc":"Researched on 2026-08-18","leafCount":0},{"id":"URL Reference Library","name":"URL Reference Library","isRoot":false,"isGroup":false,"group":"Global Context Hub Architecture","color":"#ffffff","val":8,"desc":"Researched on 2026-08-18","leafCount":0},{"id":"Shared Code Library","name":"Shared Code Library","isRoot":false,"isGroup":false,"group":"Global Context Hub Architecture","color":"#ffffff","val":8,"desc":"Researched on 2026-08-18","leafCount":0},{"id":"Execution and Telemetry","name":"Execution and Telemetry","isRoot":false,"isGroup":true,"group":"Execution and Telemetry","color":"hsl(275, 62%, 60%)","val":16,"desc":"Researched on 2026-08-18","leafCount":4},{"id":"File Analysis and Logs","name":"File Analysis and Logs","isRoot":false,"isGroup":false,"group":"Global Context Hub Architecture","color":"#ffffff","val":8,"desc":"Researched on 2026-08-18","leafCount":0},{"id":"Agent and Role Bindings","name":"Agent and Role Bindings","isRoot":false,"isGroup":false,"group":"Global Context Hub Architecture","color":"#ffffff","val":8,"desc":"Researched on 2026-08-18","leafCount":0},{"id":"Code and Prompts","name":"Code and Prompts","isRoot":false,"isGroup":true,"group":"Code and Prompts","color":"hsl(53, 62%, 60%)","val":16,"desc":"Researched on 2026-08-18","leafCount":2},{"id":"Reusable Coding Patterns","name":"Reusable Coding Patterns","isRoot":false,"isGroup":false,"group":"Global Context Hub Architecture","color":"#ffffff","val":8,"desc":"Researched on 2026-08-18","leafCount":0},{"id":"Prompt Optimization and Variants","name":"Prompt Optimization and Variants","isRoot":false,"isGroup":false,"group":"Global Context Hub Architecture","color":"#ffffff","val":8,"desc":"Researched on 2026-08-18","leafCount":0},{"id":"Aider Persistent Memory Hooks","name":"Aider Persistent Memory Hooks","isRoot":false,"isGroup":false,"group":"Global Context Hub Architecture","color":"#ffffff","val":8,"desc":"Researched on 2026-08-18","leafCount":0},{"id":"Stdlib-Only Python Architecture","name":"Stdlib-Only Python Architecture","isRoot":false,"isGroup":false,"group":"Global Context Hub Architecture","color":"#ffffff","val":8,"desc":"Researched on 2026-08-18","leafCount":0}],"links":[{"source":"Global Context Hub Architecture","target":"Concept Tree Tracking"},{"source":"Concept Tree Tracking","target":"3D Force-Directed Graphs"},{"source":"Global Context Hub Architecture","target":"Library Registries"},{"source":"Library Registries","target":"MCP Server Library"},{"source":"Library Registries","target":"Repo Scenarios Library"},{"source":"Library Registries","target":"URL Reference Library"},{"source":"Library Registries","target":"Shared Code Library"},{"source":"Global Context Hub Architecture","target":"Execution and Telemetry"},{"source":"Execution and Telemetry","target":"File Analysis and Logs"},{"source":"Execution and Telemetry","target":"Agent and Role Bindings"},{"source":"Global Context Hub Architecture","target":"Code and Prompts"},{"source":"Code and Prompts","target":"Reusable Coding Patterns"},{"source":"Code and Prompts","target":"Prompt Optimization and Variants"},{"source":"Execution and Telemetry","target":"Aider Persistent Memory Hooks"},{"source":"Execution and Telemetry","target":"Stdlib-Only Python Architecture"}]};
const INIT_DAG = 'radialout';   // 'radialout' for trees, null (free layout) for generic graphs
const byId = new Map(DATA.nodes.map(n => [n.id, n]));
// live graph state starts as the backbone
let nodes = DATA.nodes.slice();
let links = DATA.links.slice();
const expanded = new Set();
let labelMode = 'all';   // 'all' | 'domains' | 'off'
const elem = document.getElementById('graph');

// always-on text label (three-spritetext, shared three instance via the bundle)
function makeLabel(n){
  if (labelMode === 'off') return null;
  if (labelMode === 'domains' && !n.isGroup) return null;
  const s = new SpriteText(n.name);
  s.color = n.isRoot ? '#ffffff' : (n.isGroup ? n.color : (n.isLeaf ? '#9fb0c4' : '#d4e2f4'));
  s.textHeight = n.isRoot ? 9 : n.isGroup ? 5 : (n.isLeaf ? 2 : 3);
  s.fontWeight = n.isGroup ? '600' : '400';
  s.backgroundColor = 'rgba(11,14,20,0.5)';
  s.padding = n.isGroup ? 1.5 : 0.8;
  s.borderRadius = 2;
  s.position.y = (n.val || 3) + 3;
  return s;
}

const Graph = ForceGraph3D()(elem)
  .backgroundColor('#0b0e14')
  .graphData({ nodes, links })
  .nodeId('id')
  .nodeVal('val')
  .nodeColor(n => n.color)
  .nodeOpacity(0.92)
  .nodeLabel(n => `<div style="padding:2px 4px"><b>${n.name}</b>${n.skillId?'<br><span style=\"color:#9fb3c8\">'+n.skillId+'</span>':''}${n.leafCount?'<br>'+n.leafCount+' sub-concepts'+(n.sources?' · '+n.sources+' sources':''):(n.sources?'<br>'+n.sources+' sources':'')}</div>`)
  .linkColor(l => {
    const s = (l.source && typeof l.source === 'object') ? l.source : byId.get(l.source);
    return (s && s.color) ? s.color : '#9fb0c4';      // branch inherits its parent's domain color
  })
  .linkWidth(0.9)
  .linkOpacity(0.55)
  .linkCurvature(0.06)
  .linkDirectionalArrowLength(2.2)
  .linkDirectionalArrowRelPos(0.92)
  .linkDirectionalArrowColor(l => {
    const s = (l.source && typeof l.source === 'object') ? l.source : byId.get(l.source);
    return (s && s.color) ? s.color : '#9fb0c4';
  })
  .dagMode(INIT_DAG)
  .dagLevelDistance(60)
  .nodeThreeObjectExtend(true)
  .nodeThreeObject(makeLabel)
  .onNodeClick(node => focusNode(node))
  .onBackgroundClick(() => showAll());

// expand / collapse a node's leaf sub-concepts (driven from the details panel button)
function toggleExpand(node){
  if (!node.leaves || !node.leaves.length) return;
  if (!expanded.has(node.id)){
    expanded.add(node.id);
    node.leaves.forEach(leaf => {
      const id = node.id + ' ▸ ' + leaf;
      if (!byId.has(id)){
        const ln = { id, name: leaf, isLeaf: true, color: node.color, group: node.group,
                     parentName: node.name, val: 1.6, leafCount: 0, childAll: [] };
        byId.set(id, ln); nodes.push(ln);
      }
      links.push({ source: node.id, target: node.id + ' ▸ ' + leaf });
    });
  } else {
    expanded.delete(node.id);
    const dead = new Set(node.leaves.map(l => node.id + ' ▸ ' + l));
    nodes = nodes.filter(n => !dead.has(n.id));
    links = links.filter(l => !dead.has(l.target.id ?? l.target));
    dead.forEach(d => byId.delete(d));
  }
  render();
}

Graph.d3Force('charge').strength(-130);
Graph.d3Force('link').distance(34);

// fly the camera to a node
function flyTo(n){
  if (!n || n.x == null) return;
  const dist = 90, r = Math.hypot(n.x, n.y, n.z) || 1;
  Graph.cameraPosition({ x:n.x*(1+dist/r), y:n.y*(1+dist/r), z:n.z*(1+dist/r) }, n, 900);
}

// ---- details panel: show everything we know about a clicked concept ----
const details = document.getElementById('details');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const row = (k, v) => (v == null || v === '') ? '' : '<dt>' + esc(k) + '</dt><dd>' + v + '</dd>';

function showDetails(node){
  const type = node.isRoot ? 'Root' : node.isGroup ? 'Domain'
             : node.isLeaf ? 'Leaf sub-concept' : 'Concept';
  const kids = node.childAll || [];
  let kidsHtml = '';
  if (kids.length){
    kidsHtml = '<h3>' + kids.length + ' sub-concepts</h3><ul>' + kids.map(c =>
      byId.has(c) ? '<li><a data-go="' + esc(c) + '">' + esc(c) + '</a></li>'
                  : '<li>' + esc(c) + '</li>').join('') + '</ul>';
  }
  let expandBtn = '';
  if (node.leaves && node.leaves.length){
    expandBtn = '<button class="expand">' +
      (expanded.has(node.id) ? '▾ Collapse sub-concepts'
                             : '▸ Expand ' + node.leaves.length + ' sub-concepts in 3D') + '</button>';
  }
  const fmt = d => d ? esc(String(d).slice(0,10)) : '';
  details.innerHTML =
    '<button class="close" title="close">×</button>' +
    (focusId ? '<button class="showall">⟲ Show all nodes</button>' : '') +
    '<span class="badge" style="background:' + (node.color || '#888') + '">' + type + '</span>' +
    '<h2>' + esc(node.name) + '</h2>' +
    (node.desc ? '<p class="desc" style="border-color:' + (node.color || '#2a3344') + '">'
                 + esc(node.desc) + '</p>' : '') +
    '<dl>' +
      row('Domain', (node.group && node.group !== node.name) ? esc(node.group) : '') +
      row('Parent', esc(node.parent || node.parentName || '—')) +
      row('Skill', node.skillId ? '<code>' + esc(node.skillId) + '</code>' : '') +
      row('Sources', node.sources != null ? node.sources : '') +
      row('Sub-concepts', node.conceptsCount != null ? node.conceptsCount : (kids.length || '')) +
      row('Researched', fmt(node.researchedAt)) +
      row('Refreshed', fmt(node.refreshedAt)) +
    '</dl>' + expandBtn + kidsHtml;
  details.style.display = 'block';
  details.querySelector('.close').onclick = () => { details.style.display = 'none'; };
  const sa = details.querySelector('.showall');
  if (sa) sa.onclick = showAll;
  const eb = details.querySelector('button.expand');
  if (eb) eb.onclick = () => { toggleExpand(node); showDetails(node); };
  details.querySelectorAll('[data-go]').forEach(a => a.onclick = () => {
    const t = byId.get(a.dataset.go);
    if (t) focusNode(t);
  });
}

// domain navigator: clickable chip per top-level group (always-visible wayfinding)
const dom = document.getElementById('domains');
DATA.nodes.filter(n => n.isGroup && !n.isRoot)
  .sort((a,b) => a.name.localeCompare(b.name))
  .forEach(g => {
    const c = document.createElement('span');
    c.className = 'chip'; c.textContent = g.name; c.style.background = g.color;
    c.title = g.name;
    c.onclick = () => focusNode(byId.get(g.id));
    dom.appendChild(c);
  });

// layout-mode buttons (scoped to data-mode so they don't catch the label buttons)
document.querySelectorAll('#panel [data-mode]').forEach(b => b.onclick = () => {
  document.querySelectorAll('#panel [data-mode]').forEach(x => x.classList.remove('active'));
  b.classList.add('active');
  const m = b.dataset.mode === 'null' ? null : b.dataset.mode;
  Graph.dagMode(m); Graph.numDimensions(3); Graph.d3ReheatSimulation();
});

// label-mode buttons (all / domains-only / off) — re-applies the nodeThreeObject accessor
document.querySelectorAll('#panel [data-label]').forEach(b => b.onclick = () => {
  document.querySelectorAll('#panel [data-label]').forEach(x => x.classList.remove('active'));
  b.classList.add('active');
  labelMode = b.dataset.label;
  Graph.nodeThreeObject(makeLabel);   // force re-evaluation of all node objects
});

// sync the layout buttons to the initial dag mode (Free is active for generic graphs)
(function(){
  const v = (INIT_DAG === null) ? 'null' : INIT_DAG;
  document.querySelectorAll('#panel [data-mode]').forEach(x =>
    x.classList.toggle('active', x.dataset.mode === v));
})();

// search → focus matching node
document.getElementById('search').addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  const q = e.target.value.trim().toLowerCase();
  if (!q) return;
  const hit = nodes.find(n => n.name.toLowerCase().includes(q));
  if (hit) focusNode(hit);
});

// ---- focus mode: clicking a node shows only it + its directly-linked neighbors ----
let focusId = null;
const lid = e => (e && e.id != null) ? e.id : e;   // link endpoint -> id (object or string)

function setCount(nc, lc){
  document.getElementById('count').textContent = focusId == null
    ? nc + ' nodes · ' + lc + ' links'
    : 'Focused on “' + (byId.get(focusId)?.name || focusId) + '” — ' + nc + ' nodes · ' + lc +
      ' links · click empty space or Show all to reset';
}

function render(){
  let fn, fl;
  if (focusId == null){ fn = nodes; fl = links; }
  else {
    const keep = new Set([focusId]); fl = [];
    links.forEach(l => {
      const s = lid(l.source), t = lid(l.target);
      if (s === focusId){ keep.add(t); fl.push(l); }
      else if (t === focusId){ keep.add(s); fl.push(l); }
    });
    fn = nodes.filter(n => keep.has(n.id));
  }
  Graph.graphData({ nodes: fn, links: fl });
  setCount(fn.length, fl.length);
}

function focusNode(node){
  if (!node) return;
  focusId = node.id;
  render();
  showDetails(node);
  setTimeout(() => Graph.zoomToFit(600, 50), 300);   // frame the isolated neighborhood
}

function showAll(){
  focusId = null;
  details.style.display = 'none';   // reset gesture clears the (now-stale) panel too
  render();
  setTimeout(() => Graph.zoomToFit(700, 60), 200);
}

render();   // initial full render + count
</script>
</body>
